; Rig firmware for the Manta inclinometer rig's Teensy 4.0.
;
; This is the streaming firmware, as opposed to teensy/bringup, which probes.
; The two are separate builds on purpose: bringup counts bytes it does not
; understand and must keep doing exactly that, because it is the tool that finds
; a miswired UART or a module left at an unknown baud. A firmware that parses
; frames cannot answer "is anything arriving on this pin at all".
;
; USB_SERIAL for the same reason as bringup: an out-of-the-box Teensy enumerates
; as 16c0:0486 "Teensyduino RawHID", which pyserial cannot reach and which
; produces no /dev/ttyACM*. This flag moves it to 16c0:0483 and a CDC port.

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D USB_SERIAL
upload_protocol = teensy-cli
