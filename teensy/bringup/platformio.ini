; Bring-up firmware for the Manta inclinometer rig's Teensy 4.0.
;
; This is not the rig firmware. It exists to answer four questions before any
; real firmware is written, and it should stay small enough to read in one go:
;
;   1. Does the board enumerate as a serial port rather than as Raw HID?
;   2. Can this laptop open that port, and upload to it, without sudo?
;   3. Do Serial1/2/3 actually carry traffic, and is Left/Centre/Right wired
;      the way the firmware is going to assume?
;   4. What rate do the sensor modules really emit at?
;
; USB_SERIAL is the whole point of the build_flags line. An out-of-the-box
; Teensy here enumerated as 16c0:0486 "Teensyduino RawHID", which is the USB
; Type menu set to Raw HID - a Human Interface Device, not a serial port, so
; pyserial cannot reach it and no /dev/ttyACM* appears. Building with
; -D USB_SERIAL moves it to 16c0:0483 and a CDC port.

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags = -D USB_SERIAL
upload_protocol = teensy-cli
